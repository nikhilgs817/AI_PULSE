name: Publish verified release artifacts
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Build and validate run to publish
        required: true
      tag:
        description: Existing draft release tag
        required: true
      require_signed_windows:
        description: Require verified SignPath signatures (disable only for an explicitly unsigned preview)
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
      RELEASE_TAG: ${{ inputs.tag }}
      REQUIRE_SIGNED_WINDOWS: ${{ inputs.require_signed_windows }}
      SIGNPATH_CERTIFICATE_THUMBPRINT: ${{ vars.SIGNPATH_CERTIFICATE_THUMBPRINT }}
    steps:
      - uses: actions/checkout@v4
      - name: Check successful trusted build and draft release
        run: python3 scripts/publish_verified_release.py check
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run_id }}
          pattern: '*-release'
          path: build/release-upload
      - name: Verify signatures receipt, upload and publish release files
        run: python3 scripts/publish_verified_release.py publish
