name: Build and validate
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish self-contained Windows app
        shell: pwsh
        run: ./scripts/build.ps1 -Runtime win-x64
      - name: Verify data, privacy, retention and backup logic
        shell: pwsh
        run: |
          $p=Start-Process ./build/win-x64/AiPulse.exe -ArgumentList '--self-test --data-dir ./build/self-test' -WindowStyle Hidden -Wait -PassThru
          Get-Content ./build/self-test/self-test-results.txt
          if($p.ExitCode -ne 0){throw 'Self-tests failed'}
      - name: Verify multi-host transport, offline buffering and access isolation
        shell: pwsh
        run: |
          $p=Start-Process ./build/win-x64/AiPulse.exe -ArgumentList '--fleet-test --data-dir ./build/fleet-tests' -WindowStyle Hidden -Wait -PassThru
          Get-Content ./build/fleet-tests/fleet-test-results.txt
          if($p.ExitCode -ne 0){throw 'Fleet tests failed'}
      - name: Verify automatic Windows hub service lifecycle
        shell: pwsh
        run: |
          $config=Join-Path $PWD 'build/hub-service-config'
          $p=Start-Process ./build/win-x64/AiPulse.exe -ArgumentList ('--init-hub --data-dir "'+$config+'"') -WindowStyle Hidden -Wait -PassThru
          if($p.ExitCode -ne 0){throw 'Hub initialization failed'}
          $p=Start-Process ./build/win-x64/AiPulse.exe -ArgumentList ('--install-fleet hub --source-config "'+$config+'" --data-dir "'+$config+'"') -WindowStyle Hidden -Wait -PassThru
          if($p.ExitCode -ne 0){Get-Content (Join-Path $config 'startup-error.txt');throw 'Service installation failed'}
          try {
            $svc=Get-Service AIPULSEHub
            $svc.WaitForStatus('Running',[TimeSpan]::FromSeconds(20))
            if((Get-CimInstance Win32_Service -Filter "Name='AIPULSEHub'").StartMode -ne 'Auto'){throw 'Service is not automatic'}
            Restart-Service AIPULSEHub
            (Get-Service AIPULSEHub).WaitForStatus('Running',[TimeSpan]::FromSeconds(20))
            $agent=Join-Path $PWD 'build/agent-service-config'
            $connection=Join-Path $config 'dashboard-connection.json'
            $p=Start-Process ./build/win-x64/AiPulse.exe -ArgumentList ('--create-agent-config --hub-connection "'+$connection+'" --data-dir "'+$agent+'"') -WindowStyle Hidden -Wait -PassThru
            if($p.ExitCode -ne 0){throw 'Agent setup failed'}
            $p=Start-Process ./build/win-x64/AiPulse.exe -ArgumentList ('--install-fleet agent --source-config "'+$agent+'" --data-dir "'+$agent+'"') -WindowStyle Hidden -Wait -PassThru
            if($p.ExitCode -ne 0){throw 'Agent service install failed'}
            (Get-Service AIPULSEAgent).WaitForStatus('Running',[TimeSpan]::FromSeconds(20))
            if((Get-CimInstance Win32_Service -Filter "Name='AIPULSEAgent'").StartMode -ne 'Auto'){throw 'Agent service is not automatic'}
            Restart-Service AIPULSEAgent
            (Get-Service AIPULSEAgent).WaitForStatus('Running',[TimeSpan]::FromSeconds(20))
            $p=Start-Process ./build/win-x64/AiPulse.exe -ArgumentList ('--check-fleet --hub-connection "'+$connection+'" --data-dir "'+$agent+'"') -WindowStyle Hidden -Wait -PassThru
            if($p.ExitCode -ne 0){throw 'Boot agent did not reach the hub'}
          } finally {
            foreach($role in @('agent','hub')){$p=Start-Process ./build/win-x64/AiPulse.exe -ArgumentList ('--remove-fleet '+$role+' --data-dir "'+$config+'"') -WindowStyle Hidden -Wait -PassThru}
          }
      - name: Verify Windows hardware and reopening a running window
        shell: pwsh
        run: |
          $p=Start-Process ./build/win-x64/AiPulse.exe -ArgumentList '--diagnose --data-dir ./build/hardware-test' -WindowStyle Hidden -Wait -PassThru
          if($p.ExitCode -ne 0){throw 'Hardware diagnostic failed'}
          $report=Get-Content ./build/hardware-test/diagnostics.json -Raw | ConvertFrom-Json
          $ram=$report.Readings | Where-Object Id -eq 'ram.total'
          if(!($ram.Value -gt 0)){throw 'Windows RAM collection failed'}
          $first=Start-Process ./build/win-x64/AiPulse.exe -ArgumentList '--data-dir ./build/activation-test --exit-after 25' -WindowStyle Hidden -PassThru
          Start-Sleep -Seconds 4
          $second=Start-Process ./build/win-x64/AiPulse.exe -ArgumentList '--data-dir ./build/activation-test' -WindowStyle Hidden -PassThru
          if(!$second.WaitForExit(10000) -or $second.ExitCode -ne 0){throw 'Second shortcut launch did not activate the existing window'}
          if(!$first.WaitForExit(40000) -or $first.ExitCode -ne 0){throw 'GUI smoke test did not close cleanly'}
      - name: Verify compact layouts, navigation and search
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path build/ui-checks -Force | Out-Null
          $fixture=Start-Process python -ArgumentList 'tests/ui_fixture.py' -WindowStyle Hidden -PassThru
          @{EnableGateway=$false;ReadAgentUsage=$false;OllamaUrl='http://127.0.0.1:11436'} | ConvertTo-Json | Set-Content build/ui-checks/settings.json
          try {
            $ready=$false
            for($attempt=0;$attempt -lt 30;$attempt++) {
              if($fixture.HasExited){throw 'Ollama fixture exited before becoming ready'}
              try {$response=Invoke-RestMethod 'http://127.0.0.1:11436/api/ps' -TimeoutSec 2;if($response.models.Count -eq 12){$ready=$true;break}}catch{}
              Start-Sleep -Seconds 1
            }
            if(!$ready){throw 'Ollama fixture did not become ready'}
            $p=Start-Process ./build/win-x64/AiPulse.exe -ArgumentList '--ui-test --expect-models 12 --data-dir ./build/ui-checks' -WindowStyle Hidden -Wait -PassThru
          } finally {if(!$fixture.HasExited){Stop-Process -Id $fixture.Id}}
          Get-Content build/ui-checks/ui-test-results.txt
          if($p.ExitCode -ne 0 -or (Select-String -Path build/ui-checks/ui-test-results.txt -Pattern '^FAIL:')){Get-Content build/ui-checks/startup-error.txt -ErrorAction SilentlyContinue;throw 'UI checks failed'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-validation
          path: |
            build/ui-checks/*.png
            build/ui-checks/*results.txt
            build/ui-checks/startup-error.txt
            build/fleet-tests/fleet-test-results.txt
      - name: Create installer and portable archive
        shell: pwsh
        run: |
          $iscc='C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if(!(Test-Path $iscc)){throw 'Inno Setup compiler missing on runner'}
          & $iscc installer/windows.iss
          if($LASTEXITCODE -ne 0){throw 'Installer build failed'}
          Compress-Archive build/win-x64/* build/releases/AI-Pulse-0.3.0-win-x64-portable.zip
          Get-ChildItem build/releases -File | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content build/releases/SHA256SUMS-windows.txt
      - name: Install and uninstall the Windows package
        shell: pwsh
        run: |
          $installDir=Join-Path $PWD 'build/installed-app'
          $dataDir=Join-Path $PWD 'build/installed-data'
          $args='/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR="'+$installDir+'" /DATA_DIR="'+$dataDir+'"'
          $p=Start-Process ./build/releases/AI-Pulse-Setup-0.3.0-x64.exe -ArgumentList $args -WindowStyle Hidden -Wait -PassThru
          if($p.ExitCode -ne 0){throw 'Installer failed'}
          $p=Start-Process (Join-Path $installDir 'AiPulse.exe') -ArgumentList ('--self-test --data-dir "'+$dataDir+'"') -WindowStyle Hidden -Wait -PassThru
          if($p.ExitCode -ne 0){throw 'Installed executable failed tests'}
          $p=Start-Process (Join-Path $installDir 'unins000.exe') -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -WindowStyle Hidden -Wait -PassThru
          if($p.ExitCode -ne 0){throw 'Uninstaller failed'}
          if(!(Test-Path (Join-Path $dataDir 'self-test-results.txt'))){throw 'Uninstall removed user data'}
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: build/releases/*
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish self-contained Linux app
        run: |
          dotnet publish src/AiPulse/AiPulse.csproj -c Release -r linux-x64 --self-contained true -o build/linux-x64
          cp README.md LICENSE THIRD-PARTY-NOTICES.md build/linux-x64/
          cp -r docs build/linux-x64/
          chmod +x build/linux-x64/AiPulse
      - name: Verify data, privacy, retention and backup logic
        run: |
          build/linux-x64/AiPulse --self-test --data-dir build/self-test
          cat build/self-test/self-test-results.txt
      - name: Verify multi-host transport and boot service
        run: |
          build/linux-x64/AiPulse --fleet-test --data-dir build/fleet-tests
          cat build/fleet-tests/fleet-test-results.txt
          build/linux-x64/AiPulse --init-hub --data-dir build/hub-service-config
          sudo build/linux-x64/AiPulse --install-fleet hub --source-config "$PWD/build/hub-service-config" --data-dir "$PWD/build/hub-service-config"
          systemctl is-enabled aipulse-hub
          systemctl is-active aipulse-hub
          sudo systemctl restart aipulse-hub
          sleep 2
          systemctl is-active aipulse-hub
          build/linux-x64/AiPulse --create-agent-config --hub-connection "$PWD/build/hub-service-config/dashboard-connection.json" --data-dir build/agent-service-config || { cat build/agent-service-config/startup-error.txt || true; sudo cat /var/lib/aipulse-hub/logs/app.log || true; sudo journalctl -u aipulse-hub --no-pager -n 20; exit 1; }
          sudo build/linux-x64/AiPulse --install-fleet agent --source-config "$PWD/build/agent-service-config" --data-dir "$PWD/build/agent-service-config"
          systemctl is-enabled aipulse-agent
          systemctl is-active aipulse-agent
          sudo systemctl restart aipulse-agent
          build/linux-x64/AiPulse --check-fleet --hub-connection "$PWD/build/hub-service-config/dashboard-connection.json" --data-dir build/agent-service-config
          sudo build/linux-x64/AiPulse --remove-fleet agent --data-dir "$PWD/build/agent-service-config"
          sudo build/linux-x64/AiPulse --remove-fleet hub --data-dir "$PWD/build/hub-service-config"
      - name: GUI smoke test on virtual X11 desktop
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb openbox libx11-6 libice6 libsm6 libfontconfig1
          xvfb-run -a build/linux-x64/AiPulse --data-dir build/gui-test --capture --exit-after 3
          test -s build/gui-test/compact-live.png
          python3 - <<'PY'
          import sqlite3
          db=sqlite3.connect('build/gui-test/data/pulse.db')
          ids={row[0] for row in db.execute('select distinct id from metrics')}
          assert {'cpu.load','ram.used','ram.total'} <= ids, f'Hardware samples missing: {ids}'
          assert db.execute("select max(value) from metrics where id='ram.total'").fetchone()[0] > 0
          print('PASS: real Linux CPU and RAM samples persisted')
          PY
      - name: Verify compact layouts, navigation and search
        run: |
          mkdir -p build/ui-checks
          python3 tests/ui_fixture.py &
          fixture_pid=$!
          trap 'kill "$fixture_pid"' EXIT
          echo '{"EnableGateway":false,"ReadAgentUsage":false,"OllamaUrl":"http://127.0.0.1:11436"}' > build/ui-checks/settings.json
          xvfb-run -a sh -c 'openbox >/tmp/aipulse-openbox.log 2>&1 & build/linux-x64/AiPulse --ui-test --expect-models 12 --data-dir build/ui-checks'
          cat build/ui-checks/ui-test-results.txt
          ! grep -q '^FAIL:' build/ui-checks/ui-test-results.txt
      - name: Package DEB and validate installation
        run: |
          python3 scripts/package_linux.py
          sudo apt-get install -y ./build/releases/ai-pulse_0.3.0_amd64.deb
          ai-pulse --self-test --data-dir build/installed-test
          xvfb-run -a ai-pulse --data-dir build/installed-gui --capture --exit-after 1
          test -s build/installed-gui/compact-live.png
          sudo apt-get remove -y ai-pulse
      - name: Package AppImage
        run: |
          mkdir -p tools
          curl -fL https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -o tools/appimagetool.AppImage
          chmod +x tools/appimagetool.AppImage
          cd tools && ./appimagetool.AppImage --appimage-extract && cd ..
          APPIMAGETOOL="$PWD/tools/squashfs-root/AppRun" bash scripts/package-appimage.sh
          chmod +x build/releases/AI-Pulse-0.3.0-x86_64.AppImage
          build/releases/AI-Pulse-0.3.0-x86_64.AppImage --appimage-extract-and-run --self-test --data-dir build/appimage-test
          (cd build/releases && sha256sum *.deb *.AppImage > SHA256SUMS-linux.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: build/releases/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-validation
          path: |
            build/gui-test/compact-live.png
            build/gui-test/startup-error.txt
            build/self-test/self-test-results.txt
            build/ui-checks/*.png
            build/ui-checks/*results.txt
            build/ui-checks/startup-error.txt
            build/fleet-tests/fleet-test-results.txt
