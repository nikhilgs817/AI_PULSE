# Run one Collector beside an AIPULSE host-agent in the cluster. See README.md.
# The agent receives OTLP on this shared network namespace's loopback and uploads
# metadata through AIPULSE's authenticated HTTPS fleet transport.
receivers:
  prometheus/vllm:
    config:
      scrape_configs:
        - job_name: vllm
          scrape_interval: 15s
          kubernetes_sd_configs:
            - role: pod
          relabel_configs:
            - source_labels: [__meta_kubernetes_pod_annotation_aipulse_io_vllm]
              regex: 'true'
              action: keep
            - source_labels: [__meta_kubernetes_pod_phase]
              regex: Running
              action: keep
            - source_labels: [__meta_kubernetes_pod_container_port_name]
              regex: metrics
              action: keep
            - source_labels: [__meta_kubernetes_pod_container_init]
              regex: 'true'
              action: drop
            # Carry identity as ordinary labels so it survives the Prometheus/OTLP conversion.
            - source_labels: [__meta_kubernetes_pod_uid]
              target_label: aipulse_pod_uid
            - source_labels: [__meta_kubernetes_namespace]
              target_label: aipulse_namespace
            - source_labels: [__meta_kubernetes_pod_name]
              target_label: aipulse_pod
            - source_labels: [__meta_kubernetes_pod_container_name]
              target_label: aipulse_container
            - source_labels: [__meta_kubernetes_pod_container_port_number]
              target_label: aipulse_port
          metric_relabel_configs:
            - source_labels: [__name__]
              regex: 'vllm:(prompt_tokens_total|generation_tokens_total|prompt_tokens_cached_total|prompt_tokens_by_source_total)'
              action: keep
exporters:
  otlphttp/aipulse:
    endpoint: http://127.0.0.1:4319
    encoding: proto
    retry_on_failure:
      enabled: true
      max_elapsed_time: 0s
    sending_queue:
      enabled: true
      queue_size: 1000
service:
  pipelines:
    metrics:
      receivers: [prometheus/vllm]
      exporters: [otlphttp/aipulse]
