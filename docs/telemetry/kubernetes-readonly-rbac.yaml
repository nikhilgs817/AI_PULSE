apiVersion: v1
kind: ServiceAccount
metadata:
  name: aipulse-metrics
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aipulse-metrics-discovery
rules:
  - apiGroups: ['']
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aipulse-metrics-discovery
subjects:
  - kind: ServiceAccount
    name: aipulse-metrics
    namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: aipulse-metrics-discovery
