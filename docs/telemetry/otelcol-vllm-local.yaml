# OpenTelemetry Collector Contrib v0.165.0; run on the same host as AIPULSE/host-agent.
# Only token counters are selected. No request/response content is collected.
receivers:
  prometheus/vllm:
    config:
      scrape_configs:
        - job_name: vllm
          scrape_interval: 15s
          static_configs:
            - targets: [127.0.0.1:8000]
          metric_relabel_configs:
            - source_labels: [__name__]
              regex: 'vllm:(prompt_tokens_total|generation_tokens_total|prompt_tokens_cached_total|prompt_tokens_by_source_total)'
              action: keep
exporters:
  otlphttp/aipulse:
    endpoint: http://127.0.0.1:4319
    encoding: proto
    retry_on_failure:
      enabled: true
      max_elapsed_time: 0s
    sending_queue:
      enabled: true
      queue_size: 1000
service:
  pipelines:
    metrics:
      receivers: [prometheus/vllm]
      exporters: [otlphttp/aipulse]
